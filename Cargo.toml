[package]
name = "wallpaper-animado"
version = "0.1.0"
edition = "2021"
description = "Azura — gestor de fondos de pantalla animados para Linux (X11)"
license = "MIT"
repository = "https://github.com/Juanes767/azura"

[lib]
name = "wallpaper_core"
path = "src/core.rs"

[[bin]]
name = "wallpaper-daemon"
path = "src/daemon.rs"

[[bin]]
name = "wallpaper-menu"
path = "src/menu.rs"

[[bin]]
name = "wallpaper-animado"
path = "src/cli.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
gdk4-x11 = "0.9"
global-hotkey = "0.6"
x11rb = { version = "0.13", features = ["randr", "screensaver"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", features = ["blocking"] }

[profile.release]
lto = "thin"
strip = true
